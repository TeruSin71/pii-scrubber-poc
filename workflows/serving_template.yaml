apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: pii-scrubber
  annotations:
    scenarios.ai.sap.com/name: "pii-scrubber"
    scenarios.ai.sap.com/description: "Local PII scrubbing for the SAP incident KB (Presidio + GLiNER)"
    executables.ai.sap.com/name: "pii-scrubber-serve"
    executables.ai.sap.com/description: "Inference-only serving of the PII scrubber"
  labels:
    scenarios.ai.sap.com/id: "pii-scrubber"
    ai.sap.com/version: "1.0"

spec:
  inputs:
    parameters:
      - name: engine            # presidio | gliner | both
        type: string
        default: "presidio"
      - name: glinerThreshold
        type: string
        default: "0.4"

  template:
    apiVersion: "serving.kserve.io/v1beta1"

    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter

    spec: |
      predictor:
        imagePullSecrets:
          - name: docker-registry-secret
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          # Mutable TAG, not a digest, on purpose: a digest freezes this
          # template to one build, while the tag lets a corrected image flow
          # through with no template change. That was load-bearing when the
          # arm64 image had to be replaced (finding 13).
          # Rollback tag: 1.2.0 (sha256:e8a44575...81ca893).
          #
          # Blind spot, named accurately (1.2.1): BUILD_VERSION detects
          # template-to-pod drift -- a pod running an image the template does
          # not name -- but NOT tag mutation. Re-pushing :1.2.1 with the same
          # --build-arg stamps identically while the tag points at different
          # bytes. Only the digest catches that. The mutable-tag decision
          # stands; it is a known, bounded gap, not an unknown one.
          image: "ghcr.io/terusin71/pii-scrubber:1.2.1"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SCRUBBER_ENGINE
              value: "{{inputs.parameters.engine}}"
            - name: GLINER_THRESHOLD
              value: "{{inputs.parameters.glinerThreshold}}"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
